# Render Blueprint: Render reads this file and sets up the service for you.
# Dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: kust-api
    runtime: node
    plan: free
    region: frankfurt # closest Render region to Nigeria
    buildCommand: npm ci && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_ACCESS_SECRET
        generateValue: true # Render makes a strong random secret
      - key: DATABASE_URL
        sync: false # you paste it in the dashboard
      - key: EMAIL_PROVIDER
        sync: false # set by hand: gmail (once the GMAIL vars are in), later resend
      - key: EMAIL_FROM
        sync: false # Kust <the Kust Gmail address>
      - key: GMAIL_CLIENT_ID
        sync: false # kust-mailer project's OAuth client id
      - key: GMAIL_CLIENT_SECRET
        sync: false # secret: Render only, never in git
      - key: GMAIL_REFRESH_TOKEN
        sync: false # secret: from the OAuth Playground
      - key: RESEND_API_KEY
        sync: false # for later
      - key: GOOGLE_CLIENT_IDS
        sync: false # Google Cloud OAuth client id(s), comma separated, web client first
      - key: GOOGLE_WEB_CLIENT_SECRET
        sync: false # the web client's secret (server only)
